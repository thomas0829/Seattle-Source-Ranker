name: Pull Request Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.py'
      - '**/*.js'
      - '**/*.jsx'
      - 'pyproject.toml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/**'

jobs:
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Check Python syntax
      run: |
        echo "Checking Python syntax..."
        errors=0
        for file in $(find . -name "*.py" -not -path "./.venv/*" -not -path "./env/*"); do
          if ! python3 -m py_compile "$file" 2>/dev/null; then
            echo "  FAIL: $file"
            errors=$((errors + 1))
          fi
        done
        if [ $errors -gt 0 ]; then
          echo "Found $errors file(s) with syntax errors"
          exit 1
        fi
        echo "All Python files have valid syntax"

    - name: Check imports
      run: |
        python3 << 'EOF'
        import sys
        errors = []
        for mod, cls in [
            ('seattle_source_ranker.collector.distributed_collector', 'DistributedCollector'),
            ('seattle_source_ranker.tokens', 'TokenManager'),
            ('seattle_source_ranker.pypi', 'PyPIChecker'),
            ('seattle_source_ranker.scoring', 'calculate_github_score'),
        ]:
            try:
                m = __import__(mod, fromlist=[cls])
                getattr(m, cls)
                print(f"  OK: {mod}.{cls}")
            except Exception as e:
                print(f"  FAIL: {mod}.{cls}: {e}")
                errors.append(f"{mod}.{cls}")
        if errors:
            sys.exit(1)
        print("All imports successful")
        EOF

    - name: Run scoring algorithm tests
      run: pytest tests/unit/test_scoring_algorithms.py -v

    - name: Summary
      if: always()
      run: |
        echo "## Python Checks" >> $GITHUB_STEP_SUMMARY
        echo "- Syntax check" >> $GITHUB_STEP_SUMMARY
        echo "- Import verification" >> $GITHUB_STEP_SUMMARY
        echo "- Scoring algorithm tests" >> $GITHUB_STEP_SUMMARY

  frontend-check:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install and build
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Summary
      if: always()
      run: |
        echo "## Frontend Build" >> $GITHUB_STEP_SUMMARY
        echo "Build completed" >> $GITHUB_STEP_SUMMARY
