name: Collect Data and Deploy Website

on:
  schedule:
    # Daily at UTC 08:00 (Seattle 00:00 PST / 01:00 PDT)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Allow push to gh-pages branch
    
    env:
      TZ: America/Los_Angeles  # Seattle timezone (PST/PDT)
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history
        token: ${{ secrets.PAT_TOKEN }}  # Use PAT to bypass branch protection
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y redis-server
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -e .
    
    - name: Start Redis server
      run: |
        sudo systemctl start redis-server
        sudo systemctl status redis-server
    
    - name: Configure GitHub tokens
      run: |
        # Create .env.tokens file with all tokens
        cat > .env.tokens << EOF
        GITHUB_TOKEN_1=${{ secrets.GH_TOKEN_1 }}
        GITHUB_TOKEN_2=${{ secrets.GH_TOKEN_2 }}
        GITHUB_TOKEN_3=${{ secrets.GH_TOKEN_3 }}
        GITHUB_TOKEN_4=${{ secrets.GH_TOKEN_4 }}
        GITHUB_TOKEN_5=${{ secrets.GH_TOKEN_5 }}
        GITHUB_TOKEN_6=${{ secrets.GH_TOKEN_6 }}
        EOF
        
        # Export tokens to environment for workers
        echo "GITHUB_TOKEN_1=${{ secrets.GH_TOKEN_1 }}" >> $GITHUB_ENV
        echo "GITHUB_TOKEN_2=${{ secrets.GH_TOKEN_2 }}" >> $GITHUB_ENV
        echo "GITHUB_TOKEN_3=${{ secrets.GH_TOKEN_3 }}" >> $GITHUB_ENV
        echo "GITHUB_TOKEN_4=${{ secrets.GH_TOKEN_4 }}" >> $GITHUB_ENV
        echo "GITHUB_TOKEN_5=${{ secrets.GH_TOKEN_5 }}" >> $GITHUB_ENV
        echo "GITHUB_TOKEN_6=${{ secrets.GH_TOKEN_6 }}" >> $GITHUB_ENV
        
        # Count tokens
        TOKEN_COUNT=$(grep -c "^GITHUB_TOKEN_[0-9]=" .env.tokens)
        echo "[OK] Configured $TOKEN_COUNT GitHub tokens"
    
    - name: Check user data age
      id: check_user_data
      run: |
        python3 << 'PYTHON_EOF'
        import os
        import json
        from pathlib import Path
        from datetime import datetime
        from zoneinfo import ZoneInfo
        
        SEATTLE_TZ = ZoneInfo("America/Los_Angeles")
        
        # Check for seattle_users.json
        user_file = Path('data/seattle_users.json')
        
        if not user_file.exists():
            print("[ERROR] seattle_users.json not found")
            print("   → Need full collection (GraphQL + REST API)")
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                f.write('skip_graphql=false\n')
            exit(0)
        
        print(f"[FILE] Found user data: {user_file.name}")
        
        try:
            # Read collected_at from file content
            with open(user_file, 'r') as f:
                data = json.load(f)
            
            collected_at = data.get('collected_at')
            if not collected_at:
                print("[WARNING] No collected_at timestamp in file")
                print("   → Need full collection (GraphQL + REST API)")
                with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                    f.write('skip_graphql=false\n')
                exit(0)
            
            # Parse ISO format timestamp
            file_time = datetime.fromisoformat(collected_at)
            now = datetime.now(SEATTLE_TZ)
            hours_since = (now - file_time).total_seconds() / 3600
            
            print(f"[DATE] File timestamp: {file_time.isoformat()}")
            print(f"[TIME] Hours since: {hours_since:.1f}")
            
            if hours_since < 0:
                print("[WARNING] Timestamp in future")
                print("   → Need full collection (GraphQL + REST API)")
                with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                    f.write('skip_graphql=false\n')
            elif hours_since < 24:
                print(f"[OK] User data is fresh (< 24 hours)")
                print("   → Skip GraphQL (reuse existing users)")
                print("   → Only run REST API to collect projects")
                with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                    f.write('skip_graphql=true\n')
            else:
                print(f"[TIME] User data is old (≥ 24 hours)")
                print("   → Need full collection (GraphQL + REST API)")
                with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                    f.write('skip_graphql=false\n')
        
        except Exception as e:
            print(f"[ERROR] Error reading timestamp: {e}")
            print("   → Need full collection (GraphQL + REST API)")
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                f.write('skip_graphql=false\n')
        PYTHON_EOF
    
    - name: Run distributed collection
      run: |
        echo "[START] Starting distributed collection..."
        python3 << 'PYTHON_EOF'
        from seattle_source_ranker.collector.distributed_collector import DistributedCollector
        import json
        import os
        import sys
        from datetime import datetime
        from zoneinfo import ZoneInfo
        
        SEATTLE_TZ = ZoneInfo("America/Los_Angeles")
        
        # Check if we should skip GraphQL
        skip_graphql = '${{ steps.check_user_data.outputs.skip_graphql }}' == 'true'
        
        if skip_graphql:
            print("=" * 60)
            print("[FAST] FAST MODE: Skipping GraphQL user search")
            print("   Using existing user data from repository")
            print("   Only collecting projects via REST API")
            print("=" * 60)
        else:
            print("=" * 60)
            print("[FULL] FULL MODE: Running complete collection")
            print("   Step 1: GraphQL user search")
            print("   Step 2: REST API project collection")
            print("=" * 60)
        
        collector = DistributedCollector(
            batch_size=50,
            auto_manage_workers=True,
            num_workers=8,
            concurrency=2
        )
        
        # Collect data - output to timestamped file
        timestamp = datetime.now(SEATTLE_TZ).strftime("%Y%m%d_%H%M%S")
        output_file = f"data/seattle_projects_{timestamp}.json"
        
        # The collector will automatically skip GraphQL if user file < 24h exists
        collector.collect(max_users=30000, output_file=output_file)
        
        print(f"[OK] Collection completed: {output_file}")
        
        # Create success marker
        with open('data/.collection_success', 'w') as f:
            f.write(datetime.now(SEATTLE_TZ).isoformat())
        PYTHON_EOF
      timeout-minutes: 180  # 3 hour timeout
    
    - name: Verify collection results
      run: |
        # Verify collected data
        if [ ! -f "data/.collection_success" ]; then
          echo "[ERROR] Collection failed - success marker not found"
          exit 1
        fi
        
        LATEST_PROJECTS=$(ls -t data/seattle_projects_*.json 2>/dev/null | head -1)
        if [ -z "$LATEST_PROJECTS" ]; then
          echo "[ERROR] Collection failed - no projects data found"
          exit 1
        fi
        
        echo "[OK] Collection verification passed: $LATEST_PROJECTS"
    
    - name: Update Top PyPI packages ranking
      run: |
        echo "[PYPI] Updating Top PyPI packages ranking..."
        python3 scripts/update_top_pypi_packages.py
        echo "[OK] Top PyPI packages ranking checked"
    
    - name: Generate PyPI projects list
      run: |
        echo "[PKG] Checking Python projects on PyPI..."
        LATEST_PROJECTS=$(ls -t data/seattle_projects_*.json | head -1)
        python3 scripts/generate_pypi_projects.py "$LATEST_PROJECTS"
        echo "[OK] PyPI projects list generated"
    
    - name: Verify PyPI package owners (daily)
      run: |
        echo "[VERIFY] Verifying PyPI package owners..."
        python3 scripts/verify_pypi_owners.py
        echo "[OK] PyPI ownership verification completed"
    
    - name: Extract Top PyPI matches
      run: |
        echo "[MATCH] Extracting Seattle projects in Top PyPI..."
        python3 scripts/extract_top_pypi_matches.py
        echo "[OK] Top PyPI matches extracted"
    
    - name: Validate and enrich data (secondary update)
      run: |
        echo "[VALIDATE] Running secondary validation and enrichment..."
        LATEST_PROJECTS=$(ls -t data/seattle_projects_*.json | head -1)
        echo "[FILE] Processing: $LATEST_PROJECTS"
        
        # Start Celery workers
        bash scripts/start_workers.sh
        
        # Run secondary update (validate, remove invalid, update watchers)
        # Output will be saved to data/seattle_projects.json (standard filename)
        python3 scripts/secondary_update.py "$LATEST_PROJECTS"
        
        # Stop workers
        bash scripts/stop_workers.sh
        echo "[OK] Data validated and enriched → data/seattle_projects.json"
    
    - name: Generate frontend paginated data
      run: |
        echo "[DATA] Generating frontend data with topics..."
        python3 scripts/generate_frontend_data.py
        echo "[OK] Frontend data generated with topics support"
    
    - name: Update standard data files
      run: |
        echo "[COPY] Updating standard data files from timestamped versions..."
        
        # Copy latest seattle_users_*.json to seattle_users.json
        LATEST_USERS=$(ls -t data/seattle_users_*.json 2>/dev/null | head -1)
        if [ -n "$LATEST_USERS" ]; then
          cp "$LATEST_USERS" data/seattle_users.json
          echo "[OK] Updated seattle_users.json from $LATEST_USERS"
        else
          echo "[SKIP] No timestamped user file found"
        fi
    
    - name: Clean temporary timestamped files
      run: |
        echo "[CLEAN] Cleaning temporary timestamped files..."
        cd data
        
        # Delete timestamped project files (keep only seattle_projects.json)
        ls -t seattle_projects_*.json 2>/dev/null | xargs -r rm -v
        echo "[OK] Removed timestamped project files"
        
        # Delete old timestamped user files (keep only seattle_users.json)
        if [ -f "seattle_users.json" ]; then
          ls seattle_users_*.json 2>/dev/null | xargs -r rm -v
          echo "[OK] Removed timestamped user files"
        fi
        
        # Delete success marker
        rm -f .collection_success
        
        echo "[FILES] Remaining data files:"
        ls -lh *.json 2>/dev/null | awk '{print $9, $5}'
    
    - name: Copy PyPI data to frontend
      run: |
        echo "[PKG] Copying PyPI data to frontend..."
        # Remove symlink if exists and create directory
        rm -rf frontend/public/data
        mkdir -p frontend/public/data
        cp data/seattle_pypi_projects.json frontend/public/data/
        echo "[OK] PyPI data copied to frontend/public/data/"
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/build
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy: Update with latest data'
    
    - name: Update README with latest stats
      run: |
        echo "[README] Updating README.md with collection statistics..."
        python3 scripts/update_readme.py
        echo "[OK] README.md updated"
    
    - name: Commit user data and PyPI data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        echo "[CHECK] Verifying data files..."
        
        # Verify seattle_users.json exists and is valid
        if [ -f "data/seattle_users.json" ]; then
          USER_COUNT=$(jq -r '.total_users // 0' "data/seattle_users.json" 2>/dev/null || echo "0")
          echo "[OK] seattle_users.json: $USER_COUNT users"
        else
          echo "[WARNING] seattle_users.json not found"
        fi
        
        # Verify seattle_pypi_projects.json exists
        if [ -f "data/seattle_pypi_projects.json" ]; then
          PYPI_COUNT=$(jq -r '.projects_on_pypi // 0' "data/seattle_pypi_projects.json" 2>/dev/null || echo "0")
          echo "[OK] seattle_pypi_projects.json: $PYPI_COUNT projects"
        else
          echo "[WARNING] seattle_pypi_projects.json not found"
        fi
        
        # Add standard filenames (no timestamps)
        # Note: seattle_projects.json is managed by Git LFS
        git add data/seattle_users.json data/seattle_pypi_projects.json data/pypi_official_packages.json data/seattle_top_pypi_matches.json data/top_pypi_packages.json README.md 2>/dev/null || true
        
        # Check if there are changes
        if git diff --staged --quiet; then
          echo "[OK] No changes to commit"
        else
          echo "[COMMIT] Committing updated data and README"
          git commit -m "chore: Update data and README - $(date +'%Y-%m-%d %H:%M PST' -d 'TZ=\"America/Los_Angeles\"')"
          git push
        fi
    
    - name: Summary
      if: always()
      run: |
        echo "## Collection Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check standard filename (after secondary_update.py)
        if [ -f "data/seattle_projects.json" ]; then
          USERS=$(jq -r '.successful_users // 0' "data/seattle_projects.json" 2>/dev/null || echo "0")
          PROJECTS=$(jq -r '.total_projects // 0' "data/seattle_projects.json" 2>/dev/null || echo "0")
          STARS=$(jq -r '.total_stars // 0' "data/seattle_projects.json" 2>/dev/null || echo "0")
          
          echo "- **Users:** $USERS" >> $GITHUB_STEP_SUMMARY
          echo "- **Projects:** $PROJECTS" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Stars:** $STARS" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`seattle_projects.json\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Projects data file not found" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Show user data info
        if [ -f "data/seattle_users.json" ]; then
          USER_COUNT=$(jq -r '.total_users // 0' "data/seattle_users.json" 2>/dev/null || echo "0")
          echo "- **User Accounts:** $USER_COUNT" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Show PyPI data info
        if [ -f "data/seattle_pypi_projects.json" ]; then
          PYPI_COUNT=$(jq -r '.projects_on_pypi // 0' "data/seattle_pypi_projects.json" 2>/dev/null || echo "0")
          TOTAL_PYTHON=$(jq -r '.total_python_projects // 0' "data/seattle_pypi_projects.json" 2>/dev/null || echo "0")
          DETECTION_RATE=$(jq -r '.detection_rate // "0%"' "data/seattle_pypi_projects.json" 2>/dev/null || echo "0%")
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PyPI Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Python Projects:** $TOTAL_PYTHON" >> $GITHUB_STEP_SUMMARY
          echo "- **On PyPI:** $PYPI_COUNT ($DETECTION_RATE)" >> $GITHUB_STEP_SUMMARY
        fi
